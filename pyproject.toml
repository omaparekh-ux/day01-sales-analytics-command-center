[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "day01-sales-analytics-command-center"
version = "1.1.0"
description = "Reproducible portfolio-grade sales analytics command center"
requires-python = ">=3.11"
dependencies = ["pandas==2.2.3", "numpy==2.2.4"]

[project.optional-dependencies]
test = ["pytest==8.3.5"]
dev = ["pytest==8.3.5", "ruff==0.11.2"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
